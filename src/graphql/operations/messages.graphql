fragment MessageItem on Message {
  id
  transferId
  senderId
  parentId
  isDeleted
  isEdited
  message
  location
  file
  time
  sender {
    id
    name
    firstName
    lastName
    profileImage
  }
  parent {
    id
    senderId
    isDeleted
    message
    location
    file
  }
}

query Messages($transferId: ID!) {
  messages(transferId: $transferId, ordering: [{ time: ASC }]) {
    ...MessageItem
  }
}

mutation SendMessage($data: SendMessage!) {
  sendMessage(data: $data) {
    ...MessageItem
  }
}

mutation UpdateMessage($data: UpdateMessage!) {
  updateMessage(data: $data) {
    ...MessageItem
  }
}

mutation DeleteMessage($id: ID!) {
  deleteMessage(id: $id) {
    ...MessageItem
  }
}

mutation SeeMessages($transferId: ID!) {
  seeMessages(transferId: $transferId) {
    success
  }
}

# Mesajlar sayfası: aktif (ASSIGNED/STARTED) transferler sohbet listesi olarak
fragment MessageThread on Transfer {
  id
  status
  pickupTime
  pickupAddress
  dropoffAddress
  customerId
  driverId
  operatorId
  customer {
    id
    name
    firstName
    lastName
    profileImage
  }
  driver {
    id
    name
    firstName
    lastName
    profileImage
  }
}

query MessageThreads($filters: TransferFilter) {
  transfers(filters: $filters, ordering: [{ pickupTime: ASC }], pagination: { offset: 0, limit: 100 }) {
    count
    transfers {
      ...MessageThread
    }
  }
}
